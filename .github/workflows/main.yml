name: Build SaveHub Desktop Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask yt-dlp imageio-ffmpeg pywebview pyinstaller certifi
    - name: Build with PyInstaller
      run: python build.py
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaveHub-Windows
        path: dist/

  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask yt-dlp imageio-ffmpeg pywebview pyinstaller certifi
        pip install pyobjc-framework-Cocoa pyobjc-framework-WebKit
    - name: Build with PyInstaller
      run: python build.py
    - name: Upload Mac Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaveHub-Mac
        path: dist/
