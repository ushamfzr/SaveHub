name: Build SaveHub Desktop Apps

# TRIGGER: To rebuild, change the date below and commit
# Last built: 2026-08-19

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # Windows Build (artifact not uploaded - use UpdateAndRebuild.bat locally)
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask imageio-ffmpeg pywebview pyinstaller certifi
        pip install yt-dlp --pre

    - name: Build with PyInstaller
      run: python build.py

  # ─────────────────────────────────────────────
  # macOS Build
  # ─────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask imageio-ffmpeg pywebview pyinstaller certifi
        pip install yt-dlp --pre
        pip install pyobjc-framework-Cocoa pyobjc-framework-WebKit

    - name: Build with PyInstaller
      run: python build.py

    - name: Package .app into DMG
      run: |
        APP_PATH="dist/SaveHub by UG.app"
        DMG_PATH="dist/SaveHub_by_UG_Mac.dmg"
        hdiutil create \
          -volname "SaveHub by UG" \
          -srcfolder "$APP_PATH" \
          -ov \
          -format UDZO \
          "$DMG_PATH"

    - name: Upload Mac DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaveHub-Mac
        path: dist/SaveHub_by_UG_Mac.dmg
        retention-days: 3
